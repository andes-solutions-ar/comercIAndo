  background: var(--line);
  padding: 2.5px;
  cursor: pointer;
  display: flex;
  transition: all .2s;
  flex-shrink: 0;
}
.switch-toggle.on {
  background: var(--ok);
  justify-content: flex-end;
}
.switch-knob {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}


/* Fotos de producto */
.product-photo-field { gap: 8px; }
.product-photo-help { color: var(--mute); font-size: 11.5px; line-height: 1.4; }
.product-photo-input {
  width: 100%;
  padding: 10px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  background: var(--s2);
}
.product-images-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 10px;
  margin-top: 4px;
}
.product-image-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--s);
  overflow: hidden;
}
.product-image-card.primary { border-color: var(--ac); box-shadow: 0 0 0 2px var(--acs); }
.product-image-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  background: var(--s2);
}
.product-image-actions {
  display: flex;
  gap: 6px;
  padding: 7px;
}
.product-image-actions button {
  flex: 1;
  padding: 6px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--s);
  font-size: 11px;
  font-weight: 600;
}
.product-image-actions button:hover { background: var(--bg); }
.product-image-actions .primary-btn.on {
  color: var(--ac);
  border-color: var(--ac-border);
  background: var(--acs);
}
.product-primary-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  padding: 3px 7px;
  border-radius: 99px;
  background: rgba(15, 23, 42, .82);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
}
.product-image-empty {
  grid-column: 1 / -1;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: var(--mute);
  font-size: 12px;
  text-align: center;
  background: var(--s2);
}
.tile.product-photo { overflow: hidden; padding: 0; }
.tile.product-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Modales */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 18, .4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal-backdrop.open { display: flex; }
.modal-box {
  width: min(520px, 100%);
  background: var(--s);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  box-shadow: var(--sh-lg);
  animation: modalIn .18s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.96); }
  to { opacity: 1; transform: scale(1); }
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.form-stack {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 11.5px; font-weight: 600; color: var(--mute); }

/* Ticket Térmico */
.ticket-paper {
  background: #ffffff;
  color: #111111;
  padding: 22px 18px;
  border-radius: 8px;
  font-family: var(--fm);
  font-size: 11px;
  border: 1px solid #ddd;
  max-width: 320px;
  margin: 0 auto;
  line-height: 1.4;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}
.ticket-head {
  text-align: center;
  border-bottom: 1px dashed #666;
  padding-bottom: 8px;
  margin-bottom: 10px;
}
.ticket-head h4 { font-size: 14px; font-weight: 700; }
.ticket-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.ticket-div { border-bottom: 1px dashed #666; margin: 8px 0; }
.ticket-total { font-size: 13.5px; font-weight: 700; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: var(--s);
  padding: 11px 18px;
  border-radius: 12px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all .24s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 120;
  box-shadow: var(--sh-lg);
  font-size: 13px;
  white-space: nowrap;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }


/* Gestión de productos y categorías */
.bulk-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.bulk-toolbar .selection-info {
  color: var(--mute);
  font-size: 12.5px;
  margin-right: auto;
}
.check-cell { width: 42px; text-align: center; }
.check-cell input { width: 16px; height: 16px; accent-color: var(--ac); cursor: pointer; }
tr.is-selected td { background: var(--acs) !important; }
.category-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.category-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--s2);
}
.category-row b { flex: 1; }
.category-row small { color: var(--mute); }
.category-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.category-create { display: flex; gap: 8px; align-items: end; }
.category-create .form-field { flex: 1; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger.g { background: var(--s); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

}

.checkout-overlay{padding:20px;background:rgba(13,24,55,.35);backdrop-filter:blur(9px)}

.checkout-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

openModal('Cobrar venta','Revisá el detalle antes de registrar esta operación.',`<div class="lite-total"><span>TOTAL A COBRAR</span><strong id="payTotal">${money(total)}</strong></div><div class="lite-rows">${Object.entries(cart).map(([id,q])=>{const p=state.products.find(p=>p.id===Number(id));return `<div class="lite-row"><div><b>${esc(p.name)}</b><div class="lite-note">${q} × ${money(p.price)}</div></div><strong>${money(q*p.price)}</strong></div>`}).join('')}</div><div class="lite-form" style="margin-top:16px"><label class="full">Descuento fijo (ARS)<input id="discountInput" type="number" min="0" max="${sum}" class="lite-input" value="${discount}"><small class="lite-note">Aplicable sólo a esta venta.</small></label><label class="full">Medio de pago<div class="lite-choice">${['Efectivo','Transferencia'].map(x=>`<button type="button" data-payment="${x}" class="${payment===x?'active':''}">${x}</button>`).join('')}</div></label><label class="full">Tipo de entrega<div class="lite-choice">${['Retiro','Envío'].map(x=>`<button type="button" data-delivery="${x}" class="${delivery===x?'active':''}">${x}</button>`).join('')}</div></label><label class="full">Nombre del cliente<input id="customer" class="lite-input" value="${esc(customer)}" placeholder="Nombre de quien recibe o retira"></label>${delivery==='Envío'?`<label class="full">Dirección de entrega<input id="address" class="lite-input" value="${esc(address)}" placeholder="Dirección de entrega"></label>`:''}</div><p class="lite-note" style="margin-top:15px">Operación simulada: no se realiza un cobro real ni se emiten comprobantes fiscales.</p>`,`<button class="btn g" data-action="close-modal">Volver</button><button class="btn" data-action="confirm-sale">✓ Confirmar venta</button>`);
$('#discountInput').addEventListener('input',e=>{discount=Math.max(0,Math.min(sum,Number(e.target.value)||0));$('#payTotal').textContent=money(sum-discount)})}
function confirmSale(){const missing=Object.entries(cart).find(([id,q])=>(state.products.find(p=>p.id===Number(id))?.stock||0)<q);if(missing)return toast('Stock insuficiente para confirmar esta venta.',true);const customer=($('#customer')?.value||'').trim(),address=($('#address')?.value||'').trim();if(!customer)return toast('Ingresá el nombre del cliente.',true);if(delivery==='Envío'&&!address)return toast('Ingresá la dirección de envío.',true);const id='V-'+String(1001+state.sales.length);let rows=Object.entries(cart).map(([pid,qty])=>{const p=state.products.find(p=>p.id===Number(pid));p.stock-=qty;state.movements.push({at:new Date().toISOString(),name:p.name,delta:-qty,reason:id});return {id:p.id,name:p.name,qty,price:p.price}});state.sales.unshift({id,at:new Date().toISOString(),total:Math.max(0,cartTotal()-discount),payment,delivery,customer,items:rows});state.deliveries.unshift({id:'P-'+String(101+state.deliveries.length),sale:id,customer,type:delivery,address,status:'Pendiente'});cart={};closeModal();render();tone();toast('Venta registrada en la maqueta')}
function refreshProductProfit(){const cost=Number($('#productForm [name="cost"]')?.value||0),price=Number($('#productForm [name="price"]')?.value||0);const gain=marginAmount(cost,price),costPct=marginOnCost(cost,price),salePct=marginOnSale(cost,price);$('#profitAmount')&&($('#profitAmount').textContent=money(gain));$('#profitCostPct')&&($('#profitCostPct').textContent=cost?costPct.toFixed(1)+'%':'0%');$('#profitSalePct')&&($('#profitSalePct').textContent=price?salePct.toFixed(1)+'%':'0%');}
function productModal(id){syncCategories();const p=state.products.find(x=>x.id===id);editingId=id||null;openModal(p?'Editar producto':'Nuevo producto','Registro básico de artículos para Stock Lite.',`<form id="productForm" class="lite-form"><label class="full">Nombre del producto *<input name="name" required class="lite-input" maxlength="120" value="${esc(p?.name||'')}" placeholder="Ej. Yerba mate 1 kg"></label><label>Categoría *<select name="cat" required class="lite-input">${state.categories.map(cat=>`<option value="${esc(cat)}" ${((p?.cat||'Almacén')===cat)?'selected':''}>${esc(cat)}</option>`).join('')}</select></label><label>Precio de compra ($) *<input name="cost" type="number" min="0" step="0.01" required class="lite-input" value="${p?.cost||0}"></label><label>Precio de venta ($) *<input name="price" type="number" min="0" step="0.01" required class="lite-input" value="${p?.price||0}"></label><div class="lite-profit-box"><div><small>Ganancia por unidad</small><strong id="profitAmount">${money(marginAmount(p?.cost||0,p?.price||0))}</strong></div><div><small>Rentabilidad sobre costo</small><strong id="profitCostPct">${marginOnCost(p?.cost||0,p?.price||0).toFixed(1)}%</strong></div><div><small>Margen sobre venta</small><strong id="profitSalePct">${marginOnSale(p?.cost||0,p?.price||0).toFixed(1)}%</strong></div></div><label>Código de barras<input name="barcode" maxlength="80" class="lite-input" value="${esc(p?.barcode||'')}" placeholder="Código opcional"></label><label>Stock disponible<input name="stock" type="number" min="0" step="1" required class="lite-input" value="${p?.stock||0}"></label><label>Stock mínimo<input name="min" type="number" min="0" step="1" required class="lite-input" value="${p?.min||0}"></label><div class="lite-help-box">Usá el botón <b>Categorías</b> para agregar, editar o suprimir categorías del inventario.</div></form><p class="lite-note" style="margin-top:15px">Alta manual Lite; el escáner remoto de celular pertenece al plan Negocios.</p>`,`<button class="btn g" data-action="close-modal">Cancelar</button><button class="btn g" data-action="categories">Categorías</button><button class="btn" data-action="save-product">Guardar producto</button>`);['cost','price'].forEach(name=>$('#productForm [name="'+name+'"]')?.addEventListener('input',refreshProductProfit));}
function saveProduct(){const f=$('#productForm');if(!f.reportValidity())return;const data=Object.fromEntries(new FormData(f));const other=state.products.find(p=>p.id!==editingId&&data.barcode&&p.barcode===data.barcode);if(other)return toast('Ese código de barras ya está vinculado a otro producto.',true);const values={name:data.name.trim(),cat:data.cat.trim(),cost:Number(data.cost),price:Number(data.price),barcode:data.barcode.trim(),stock:Number(data.stock),min:Number(data.min)};if(values.price<values.cost)return toast('El precio de venta no puede ser menor que el precio de compra en esta maqueta.',true);if(editingId){Object.assign(state.products.find(p=>p.id===editingId),values)}else{state.products.push({id:Math.max(0,...state.products.map(p=>p.id))+1,...values,emoji:'📦',published:false})}syncCategories();closeModal();render();toast('Producto guardado en la maqueta')}
function categoryModal(){syncCategories();openModal('Categorías','Agregá, editá o suprimí categorías para organizar tu Stock Lite.',`<div class="lite-inline-row" style="margin-bottom:14px"><label class="grow">Nueva categoría<input id="categoryName" class="lite-input" maxlength="50" placeholder="Ej. Limpieza"></label><button type="button" class="btn" data-action="add-category">Agregar categoría</button></div><div class="lite-rows">${state.categories.map(cat=>`<div class="lite-category-head"><div><b>${esc(cat)}</b><small style="display:block;color:var(--muted)">${state.products.filter(p=>p.cat===cat).length} producto(s)</small></div><div class="lite-category-actions"><button class="btn g sm" data-action="edit-category:${encodeURIComponent(cat)}">Editar</button><button class="btn g sm" data-action="delete-category:${encodeURIComponent(cat)}">Suprimir</button></div></div>`).join('')||'<p class="lite-note">Todavía no hay categorías.</p>'}</div>`,`<button class="btn g" data-action="close-modal">Cerrar</button>`)}
function addCategory(){const input=$('#categoryName');const name=(input?.value||'').trim();if(!name)return toast('Ingresá el nombre de la categoría.',true);if(state.categories.some(c=>c.toLowerCase()===name.toLowerCase()))return toast('Esa categoría ya existe.',true);state.categories.push(name);syncCategories();categoryModal();toast('Categoría agregada')}
function editCategory(oldName){const current=decodeURIComponent(oldName);const next=prompt('Editar categoría',current);if(next===null)return;const name=next.trim();if(!name)return toast('Ingresá un nombre válido.',true);if(state.categories.some(c=>c!==current&&c.toLowerCase()===name.toLowerCase()))return toast('Ya existe otra categoría con ese nombre.',true);state.categories=state.categories.map(c=>c===current?name:c);state.products.filter(p=>p.cat===current).forEach(p=>p.cat=name);syncCategories();categoryModal();render();toast('Categoría actualizada')}
function deleteCategory(oldName){const current=decodeURIComponent(oldName);if(state.products.some(p=>p.cat===current))return toast('No podés suprimir una categoría que aún tenga productos asociados.',true);state.categories=state.categories.filter(c=>c!==current);syncCategories();categoryModal();render();toast('Categoría eliminada')}
function moveModal(){openModal('Registrar movimiento','Entrada o salida de stock Lite.',`<form class="lite-form" id="moveForm"><label class="full">Producto<select name="id" class="lite-input">${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.stock} u.</option>`).join('')}</select></label><label>Tipo<select name="type" class="lite-input"><option value="in">Entrada</option><option value="out">Salida</option></select></label><label>Cantidad<input name="qty" class="lite-input" type="number" min="1" step="1" value="1" required></label></form>`,`<button class="btn g" data-action="close-modal">Cancelar</button><button class="btn" data-action="save-move">Registrar</button>`)}
function saveMove(){const f=$('#moveForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f)),p=state.products.find(x=>x.id===Number(d.id)),qty=Number(d.qty)*(d.type==='out'?-1:1);if(p.stock+qty<0)return toast('No se puede dejar el stock en negativo.',true);p.stock+=qty;state.movements.push({at:new Date().toISOString(),name:p.name,delta:qty,reason:'Ajuste Lite'});closeModal();render();toast('Movimiento registrado')}
function deliveryModal(){openModal('Nuevo pedido Lite','Creá un pedido ficticio para recorrer el flujo.',`<form class="lite-form" id="deliveryForm"><label class="full">Nombre del cliente<input name="customer" class="lite-input" required placeholder="Nombre del cliente"></label><label>Modalidad<select name="type" class="lite-input"><option>Retiro</option><option>Envío</option></select></label><label>Dirección (para envíos)<input name="address" class="lite-input" placeholder="Dirección"></label></form>`,`<button class="btn g" data-action="close-modal">Cancelar</button><button class="btn" data-action="save-delivery">Crear pedido</button>`)}
function saveDelivery(){const f=$('#deliveryForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(d.type==='Envío'&&!d.address.trim())return toast('Ingresá la dirección de envío.',true);state.deliveries.unshift({id:'P-'+String(101+state.deliveries.length),sale:'Manual',customer:d.customer,type:d.type,address:d.address,status:'Pendiente'});closeModal();render();toast('Pedido creado en la maqueta')}
function saleDetail(id){const s=state.sales.find(s=>s.id===id);if(!s)return;openModal('Detalle de '+s.id,'Operación simulada.',`<div class="lite-row"><span>Medio de pago</span><b>${esc(s.payment)}</b></div><div class="lite-row"><span>Tipo de entrega</span><b>${esc(s.delivery||'Retiro')}</b></div><div class="lite-row"><span>Cliente</span><b>${esc(s.customer||'—')}</b></div><div class="lite-rows" style="margin-top:12px">${(s.items||[]).map(i=>`<div class="lite-row"><span>${esc(i.name)} · ${i.qty} u.</span><b>${money(i.price*i.qty)}</b></div>`).join('')}</div><div class="lite-total"><span>Total</span><strong>${money(s.total)}</strong></div>`,`<button class="btn" data-action="close-modal">Cerrar</button>`)}
function preview(){const items=state.products.filter(p=>p.published);openModal('Catálogo virtual Lite','Vista previa local. No existe una tienda online publicada.',`<div class="lite-catalog-preview">${items.map(p=>`<div class="lite-preview-item">${avatar(p)}<b>${esc(p.name)}</b><small>${money(p.price)}</small></div>`).join('')||'<p class="lite-empty">No hay productos publicados.</p>'}</div>`,`<button class="btn" data-action="close-modal">Cerrar</button>`)}
function saveSettings(){state.store=($('#storeEdit').value||'Mi emprendimiento').trim();state.theme=$('#themeEdit').value;state.sound=$('#soundEdit').value==='true';document.documentElement.dataset.theme=state.theme;render();toast('Preferencias actualizadas')}
function modalAction(code){if(code==='close-modal')return closeModal();if(code==='confirm-sale')return confirmSale();if(code==='save-product')return saveProduct();if(code==='save-move')return saveMove();if(code==='save-delivery')return saveDelivery();if(code==='add-category')return addCategory()}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target||target.disabled)return;
 if(target=== $('#bg')){toggleNav();return}if(target.id==='sidebarModeToggle'){sidebarPinned=!sidebarPinned;try{localStorage.setItem(SIDEBAR_PREF_KEY,sidebarPinned?'pinned':'compact')}catch{}applySidebarMode();tone();return}if(target===$('#modalX')){closeModal();return}if(target===$('#cashHeader')){state.cash=!state.cash;render();tone();toast(state.cash?'Caja abierta':'Caja cerrada');return}
 if(target.dataset.go){go(target.dataset.go);tone();return}
 if(target.dataset.pref){if(target.dataset.pref==='theme'){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme}else state.sound=!state.sound;renderNav();tone();return}
 if(target.dataset.add){const p=state.products.find(p=>p.id===Number(target.dataset.add));if((cart[p.id]||0)>=p.stock)return toast('Sin más existencias.',true);cart[p.id]=(cart[p.id]||0)+1;render();tone();return}
 if(target.dataset.qty){const id=Number(target.dataset.qty),p=state.products.find(p=>p.id===id);cart[id]=Math.min(p.stock,(cart[id]||0)+Number(target.dataset.delta));if(cart[id]<=0)delete cart[id];render();tone();return}
 if(target.dataset.category){category=target.dataset.category;render();$('#posSearch')?.focus();return}
 if(target.dataset.payment){const customer=$('#customer')?.value||'',addr=$('#address')?.value||'';payment=target.dataset.payment;renderCheckout();$('#customer').value=customer;if($('#address'))$('#address').value=addr;return}
 if(target.dataset.delivery){const customer=$('#customer')?.value||'',addr=$('#address')?.value||'';delivery=target.dataset.delivery;renderCheckout();$('#customer').value=customer;if($('#address'))$('#address').value=addr;return}
 const code=target.dataset.action;if(!code)return;
 if(code==='new-product')return productModal(null);
 if(code==='categories')return categoryModal();
 if(code.startsWith('edit-category:'))return editCategory(code.split(':')[1]);
 if(code.startsWith('delete-category:'))return deleteCategory(code.split(':')[1]);
 if(code.startsWith('edit:'))return productModal(Number(code.split(':')[1]));
 if(code==='move')return moveModal();if(code==='new-delivery')return deliveryModal();
 if(code==='go-pos')return go('pos');if(code==='checkout')return checkout();
 if(code==='clear-cart'){cart={};render();return toast('Carrito vaciado')}
 if(code==='toggle-cash'){state.cash=!state.cash;render();return toast(state.cash?'Caja abierta':'Caja cerrada')}
 if(code.startsWith('sale:'))return saleDetail(code.slice(5));
 if(code.startsWith('advance:')){const d=state.deliveries.find(d=>d.id===code.slice(8));d.status=d.status==='Pendiente'?'En preparación':'Entregado';render();return toast('Estado de pedido actualizado')}
 if(code.startsWith('publish:')){const p=state.products.find(p=>p.id===Number(code.slice(8)));p.published=!p.published;render();return toast(p.published?'Producto publicado en vista previa':'Producto oculto')}
 if(code==='preview')return preview();if(code==='save-settings')return saveSettings();
 if(code==='new-user'){if(state.users.length>=3)return toast('Este plan permite hasta 3 usuarios.',true);openModal('Invitar usuario','Simulación del límite de usuarios del plan.',`<label class="lite-form">Nombre completo<input class="lite-input" id="newUser" maxlength="60" placeholder="Nombre del usuario"></label>`,`<button class="btn g" data-action="close-modal">Cancelar</button><button class="btn" data-action="add-user">Agregar a la maqueta</button>`);return}
 if(code==='add-user'){const val=($('#newUser')?.value||'').trim();if(!val)return toast('Ingresá un nombre.',true);if(state.users.length>=3)return toast('Límite de 3 usuarios.',true);state.users.push(val);closeModal();render();return toast('Usuario ficticio agregado')}
 modalAction(code);
});
document.addEventListener('input',e=>{if(e.target.id==='posSearch'){searchTerm=e.target.value;const caret=e.target.selectionStart;render();const input=$('#posSearch');input?.focus();input?.setSelectionRange(caret,caret)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$('#overlay').addEventListener('click',closeNav);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeNav()}});
if(window.matchMedia('(max-width: 850px)').matches){document.body.classList.add('remake-touch')}
window.addEventListener('resize',()=>{document.body.classList.toggle('remake-touch',window.innerWidth<=850)});
document.documentElement.dataset.theme='dark';render();

</script></body></html>
